<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
  document.querySelector('.copy-email').addEventListener('click', function (e) {
    if (!navigator.clipboard) return;   // 클립보드를 못 쓰면 mailto 링크가 그대로 동작
    e.preventDefault();
    var link = this;
    navigator.clipboard.writeText(this.href.replace('mailto:', '')).then(function () {
      var t = document.getElementById('toast');
      t.textContent = 'Email copied to clipboard';
      t.classList.add('show');
      clearTimeout(t.timer);
      t.timer = setTimeout(function () { t.classList.remove('show'); }, 1800);
    }).catch(function () { window.location.href = link.href; });
  });
</script>
